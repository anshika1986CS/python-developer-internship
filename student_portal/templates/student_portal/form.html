<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if student %}Edit{% else %}Add{% endif %} Student</title>
    <style>
        body { font-family: Arial; background: #f3f5fa; padding: 30px; color: #243047; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; }
        input { display: block; box-sizing: border-box; width: 100%; padding: 11px; margin: 8px 0 16px; border: 1px solid #ccd2df; border-radius: 5px; }
        button, a { background: #4658c8; color: white; padding: 10px 14px; border: 0; border-radius: 5px; text-decoration: none; cursor: pointer; }
        .error { color: #b42335; }
    </style>
</head>
<body>
<div class="container">
    <h1>{% if student %}Edit Student{% else %}Add Student{% endif %}</h1>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <form method="post">
        {% csrf_token %}
        <label>Name</label>
        <input name="name" required maxlength="100" value="{{ student.name|default:'' }}">

        <label>Email</label>
        <input type="email" name="email" required value="{{ student.email|default:'' }}">

        <label>Course</label>
        <input name="course" required maxlength="100" value="{{ student.course|default:'' }}">

        <label>CGPA (0–10)</label>
        <input type="number" name="cgpa" min="0" max="10" step="0.01" required
               value="{{ student.cgpa|default:'' }}">

        <button type="submit">Save Student</button>
        <a href="{% url 'home' %}">Cancel</a>
    </form>
</div>
</body>
</html>
